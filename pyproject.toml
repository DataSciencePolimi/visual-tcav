[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-tcav"
version = "0.1.1"
description = "Visual-TCAV: Concept-based Attribution and Saliency Maps for Post-hoc Explainability in Image Classification"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Antonio De Santis", email = "antonio.desantis@polimi.it" },
    { name = "Riccardo Campi", email = "riccardo.campi@polimi.it" },
    { name = "Matteo Bianchi", email = "matteo.bianchi@polimi.it" },
    { name = "Marco Brambilla", email = "marco.brambilla@polimi.it" },
    { name = "Sara Cavallini", email = "saracavallini01@gmail.com" }
]
keywords = [
    "explainable-ai", "xai", "tcav", "concept-attribution",
    "pytorch", "cnn", "interpretability", "saliency-maps",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pillow>=9.0.0",
    "joblib>=1.3.0",
    "prettytable>=3.8.0",
    "tqdm>=4.65.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
# CLIP is not on PyPI — install manually before using TextToConcept:
#   pip install git+https://github.com/openai/CLIP.git
text-to-concept = [
    "scipy>=1.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]

[project.urls]
Homepage = "https://github.com/DataSciencePolimi/visual-tcav"
Repository = "https://github.com/DataSciencePolimi/visual-tcav"
"Bug Tracker" = "https://github.com/DataSciencePolimi/visual-tcav/issues"

[project.scripts]
visual-tcav = "visual_tcav.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["visual_tcav*"]

[tool.setuptools.package-data]
visual_tcav = ["py.typed"]

# ---------------------------------------------------------------------------
# pytest — 2025 standard: config inside pyproject.toml, no pytest.ini needed
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v --tb=short"
markers = [
    "slow: marks tests that take more than a few seconds (skip with -m 'not slow')",
    "gpu:  marks tests that require a GPU (skip with -m 'not gpu')",
]
minversion = "7.0"

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["visual_tcav"]
omit = [
    # CLI tested separately via CliRunner
    "visual_tcav/__main__.py",
    # Text-to-Concept extension requires CLIP (not on PyPI) and a
    # trained Linear Aligner file — cannot be tested without optional deps
    "visual_tcav/linear_aligner.py",
    "visual_tcav/text_to_concept.py",
    "tests/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true
skip_covered = false
