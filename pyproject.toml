[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-tcav"
version = "0.1.1"
description = "Visual-TCAV: Concept-based Attribution and Saliency Maps for Explainable AI in PyTorch"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Sara Cavallini", email = "saracavallini01@gmail.com" }
]
keywords = [
    "explainable-ai",
    "xai",
    "tcav",
    "concept-attribution",
    "pytorch",
    "cnn",
    "interpretability",
    "saliency-maps",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "numpy>=1.24.0",
    "matplotlib>=3.7.0",
    "pillow>=9.0.0",
    "joblib>=1.3.0",
    "prettytable>=3.8.0",
    "tqdm>=4.65.0",
    "click>=8.1.0",
]

[project.optional-dependencies]
# CLIP is not available on PyPI — install it manually before using TextToConcept:
#   pip install git+https://github.com/openai/CLIP.git
text-to-concept = [
    "scipy>=1.10.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/saracavallini01/visual-tcav"
Repository = "https://github.com/saracavallini01/visual-tcav"
"Bug Tracker" = "https://github.com/saracavallini01/visual-tcav/issues"

[project.scripts]
visual-tcav = "visual_tcav.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["visual_tcav*"]

[tool.setuptools.package-data]
visual_tcav = ["py.typed"]